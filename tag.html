<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browse Games by Category | Slope 60x</title>
  <meta name="description" content="Browse Slope 60x games by category. Choose a category and start playing instantly.">
  <link rel="canonical" href="https://slope-60x.github.io/tag.html">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="game.css">
</head>
<body>
<nav class="nav">
<a class="brand" href="index.html">SLOPE 60X</a>
<div class="nav-links">
<a href="index.html" class="nav-link">Home</a>
<a href="trending.html" class="nav-link">Trending</a>
<a href="new.html" class="nav-link">New</a>
<a href="recent.html" class="nav-link">Recent</a>
<a href="settings.html" class="nav-link">Settings</a>
</div></nav>
<main class="container">

<section class="hero">
  <h1>Category <span id="chip" class="chip" style="display:none"></span></h1>
  <p>Showing games in the selected category.</p>
  <div class="search-row">
    <input id="search" class="search" type="search" placeholder="Search games...">
    <div class="count"><span id="count">0</span> games</div>
  </div>
</section>
<section id="grid" class="grid"></section>

<script>
async function loadGames(){
  const res = await fetch("games.json", {cache: "no-store"});
  const data = await res.json();
  return data.games || [];
}
function normalize(s){ return (s||"").toString().toLowerCase(); }

function cardHTML(g){
  const href = `${g.id}.html`;
  const img = g.thumb || "";
  const cat = g.catagory || g.category || "";
  const name = g.name || "Game";
  return `
    <a class="game-card" href="${href}">
      <div class="thumb"><img loading="lazy" src="${img}" alt="${name} thumbnail"></div>
      <div class="meta">
        <div class="name">${name}</div>
        <div class="cat">${cat}</div>
      </div>
    </a>`;
}

function render(list){
  const grid = document.getElementById("grid");
  grid.innerHTML = list.map(cardHTML).join("");
  document.getElementById("count").textContent = list.length.toString();
}

function sortByPopularity(a,b){ return (b.popularity||0) - (a.popularity||0); }
function sortByRelease(a,b){
  const ad = new Date(a.releaseDate || 0).getTime();
  const bd = new Date(b.releaseDate || 0).getTime();
  return bd - ad;
}
function sortByUpdated(a,b){
  const ad = new Date(a.updateDate || a.updated || 0).getTime();
  const bd = new Date(b.updateDate || b.updated || 0).getTime();
  return bd - ad;
}

(async ()=>{
  const all = await loadGames();
  const q = new URLSearchParams(location.search);
  const cat = q.get("c");
  let list = all.slice();
  if(cat){
    const c = normalize(cat);
    list = list.filter(g => normalize(g.catagory || g.category) === c);
    const chip = document.getElementById("chip");
    if(chip){ chip.textContent = cat; chip.style.display="inline-flex"; }
  }

  // page type
  const pageType = document.body.dataset.page;
  if(pageType === "trending"){ list.sort(sortByPopularity); }
  if(pageType === "new"){ list.sort(sortByRelease); }
  if(pageType === "recent"){ list.sort(sortByUpdated); }

  // initial render
  render(list);

  // search
  const input = document.getElementById("search");
  if(input){
    input.addEventListener("input", ()=>{
      const term = normalize(input.value).trim();
      const filtered = term ? list.filter(g => normalize(g.name).includes(term)) : list;
      render(filtered);
    });
  }
})();
</script>


</main>

</body>
</html>
